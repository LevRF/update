name: Update manifest

# Запускается только событиями релизов владельца и вручную — не pull request'ами,
# поэтому код из чужих форков здесь не выполняется.
on:
  release:
    types: [published, edited, deleted, unpublished, released, prereleased]
  workflow_dispatch:

permissions: {}

concurrency:
  group: manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # Без сторонних actions: обычный git clone основной ветки (на событии release иначе был бы тег)
      - name: Checkout
        run: |
          git clone --depth 1 --branch "$BRANCH" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Build manifest.json
        working-directory: repo
        run: python3 .github/scripts/build_manifest.py manifest.json

      - name: Commit if changed
        working-directory: repo
        run: |
          if git diff --quiet -- manifest.json; then
            echo "manifest.json не изменился"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest"
          git push origin "HEAD:$BRANCH"
